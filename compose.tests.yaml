services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lorcana_test
      POSTGRES_USER: lorcana_test
      POSTGRES_PASSWORD: "${LORCANA_TEST_PASSWORD:?Run tools/Test-Lorcana.ps1}"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorcana_test -d lorcana_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /src
    volumes:
      - .:/src
    environment:
      LORCANA_TEST_DB: "Host=postgres-test;Database=lorcana_test;Username=lorcana_test"
      PGPASSWORD: "${LORCANA_TEST_PASSWORD}"
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["dotnet", "test", "Lorcana.sln", "--logger", "trx", "--results-directory", "/src/TestResults"]
